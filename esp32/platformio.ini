[platformio]
default_envs = esp32_wroom

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    -D ROVER_PROTOCOL_VERSION=\"ROVER_PROTOCOL_V1\"
    ; Optional OTA (esp32/lib/ota/RoverOTA.h, esp32/OTA.md): read from
    ; environment variables at build time only, NEVER hardcoded/committed
    ; -- this project is open source, a shared default WiFi/OTA password
    ; baked into the repo would be a real vulnerability for every
    ; downstream user who doesn't change it. Resolve to empty strings
    ; (OTA disabled) when unset, which is the default for everyone who
    ; hasn't opted in -- see OTA.md before setting these.
    -D ROVER_WIFI_SSID=\"${sysenv.ROVER_WIFI_SSID}\"
    -D ROVER_WIFI_PASSWORD=\"${sysenv.ROVER_WIFI_PASSWORD}\"
    -D ROVER_OTA_PASSWORD=\"${sysenv.ROVER_OTA_PASSWORD}\"
; Pinned to a compatible-release range (^x.y.z = >=x.y.z, <(x+1).0.0):
; lets patch/minor updates (including security fixes) through, blocks a
; surprise breaking major bump from silently changing this build.
; Versions below are what this project has actually been built/tested
; against (2026-08-31) -- bump deliberately, not by letting this drift.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit MPU6050 @ ^2.2.9
    adafruit/Adafruit_VL53L0X @ ^1.2.5
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BME680 Library @ ^2.0.6

[env:esp32_wroom]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_WROOM
    -D ROVER_BOARD_NAME=\"WROOM\"

[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_S3
    -D ROVER_BOARD_NAME=\"S3\"

# The custom Rover PCB (pcb/PCB_CONNEXIONS.md): ESP32-S3-WROOM-1-N16R2
# with the camera, charger, INA219, I/O expander and LSM6DS3TR-C on
# board. Pinout in include/board_pins_pcb_v1.h, selected by
# ROVER_BOARD_PCB_V1. ROVER_BOARD_S3 stays defined too: this IS an S3,
# and anything S3-specific elsewhere must apply here as well.
#
# NOT VERIFIED BY A BUILD in the session that wrote it (2026-10-13): the
# PlatformIO registry was unreachable from that environment. First
# thing to do locally: `pio run -e rover_pcb_v1`, and fix whatever it
# reports before anything is soldered.
[env:rover_pcb_v1]
platform = espressif32
board = esp32-s3-devkitc-1
# N16R2: 16 MB quad flash, 2 MB QUAD PSRAM. The devkitc-1 board file
# describes an 8 MB part without PSRAM, so all three are overridden.
# qio_qspi (not qio_opi) is what keeps GPIO35-37 usable as encoder
# inputs: an octal-PSRAM R8 module would claim them.
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
# Two 6.5 MB OTA app slots: OTA (esp32/OTA.md) needs two, and the camera
# brings the firmware well past the 1.3 MB slots of the 4 MB layout.
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_S3
    -D ROVER_BOARD_PCB_V1
    -D ROVER_BOARD_NAME=\"PCB_V1\"
    -D BOARD_HAS_PSRAM
    ; The board file already sets ARDUINO_USB_MODE=1 (hardware USB
    ; Serial/JTAG); this routes Serial to it at boot. The protocol stays
    ; on Serial either way, and UART0's pins (GPIO43/44) are free for
    ; the display. A write with no USB host attached returns at once
    ; (HWCDC::write), so the robot does not stall unplugged.
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit LSM6DS @ ^4.7.4

# Runs the pure-logic unit tests (test/test_*/) on the host machine's own
# compiler, no ESP32 required: `pio test -e native`. Overrides framework
# and lib_deps to blank -- [env]'s "arduino" framework and Adafruit
# hardware libraries don't apply/compile here, and aren't needed since
# these tests only exercise RoverProtocol/WheelPID/Emotion, none of which
# touch real hardware. test/stubs/Arduino.h stands in for the handful of
# Arduino symbols those files still reference (constrain(), Stream).
[env:native]
platform = native
framework =
lib_deps =
build_flags =
    -D ROVER_BOARD_WROOM
    -D ROVER_BOARD_NAME=\"NATIVE_TEST\"
    -D ROVER_PROTOCOL_VERSION=\"ROVER_PROTOCOL_V1\"
    -I include
    -I test/stubs
    -std=gnu++14

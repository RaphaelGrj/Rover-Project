[platformio]
default_envs = esp32_wroom

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    -D ROVER_PROTOCOL_VERSION=\"ROVER_PROTOCOL_V1\"

[env:esp32_wroom]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_WROOM
    -D ROVER_BOARD_NAME=\"WROOM\"

[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_S3
    -D ROVER_BOARD_NAME=\"S3\"

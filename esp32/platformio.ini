[platformio]
default_envs = esp32_wroom

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    -D ROVER_PROTOCOL_VERSION=\"ROVER_PROTOCOL_V1\"
    ; Optional OTA (esp32/lib/ota/RoverOTA.h, esp32/OTA.md): read from
    ; environment variables at build time only, NEVER hardcoded/committed
    ; -- this project is open source, a shared default WiFi/OTA password
    ; baked into the repo would be a real vulnerability for every
    ; downstream user who doesn't change it. Resolve to empty strings
    ; (OTA disabled) when unset, which is the default for everyone who
    ; hasn't opted in -- see OTA.md before setting these.
    -D ROVER_WIFI_SSID=\"${sysenv.ROVER_WIFI_SSID}\"
    -D ROVER_WIFI_PASSWORD=\"${sysenv.ROVER_WIFI_PASSWORD}\"
    -D ROVER_OTA_PASSWORD=\"${sysenv.ROVER_OTA_PASSWORD}\"
; Pinned to a compatible-release range (^x.y.z = >=x.y.z, <(x+1).0.0):
; lets patch/minor updates (including security fixes) through, blocks a
; surprise breaking major bump from silently changing this build.
; Versions below are what this project has actually been built/tested
; against (2026-08-31) -- bump deliberately, not by letting this drift.
lib_deps =
    adafruit/Adafruit GFX Library @ ^1.12.6
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
    adafruit/Adafruit BusIO @ ^1.17.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    adafruit/Adafruit MPU6050 @ ^2.2.9
    adafruit/Adafruit_VL53L0X @ ^1.2.5
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BME680 Library @ ^2.0.6

[env:esp32_wroom]
platform = espressif32
board = esp32dev
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_WROOM
    -D ROVER_BOARD_NAME=\"WROOM\"

[env:esp32_s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -D ROVER_BOARD_S3
    -D ROVER_BOARD_NAME=\"S3\"

# Runs the pure-logic unit tests (test/test_*/) on the host machine's own
# compiler, no ESP32 required: `pio test -e native`. Overrides framework
# and lib_deps to blank -- [env]'s "arduino" framework and Adafruit
# hardware libraries don't apply/compile here, and aren't needed since
# these tests only exercise RoverProtocol/WheelPID/Emotion, none of which
# touch real hardware. test/stubs/Arduino.h stands in for the handful of
# Arduino symbols those files still reference (constrain(), Stream).
[env:native]
platform = native
framework =
lib_deps =
build_flags =
    -D ROVER_BOARD_WROOM
    -D ROVER_BOARD_NAME=\"NATIVE_TEST\"
    -D ROVER_PROTOCOL_VERSION=\"ROVER_PROTOCOL_V1\"
    -I include
    -I test/stubs
    -std=gnu++14

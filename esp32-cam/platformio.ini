[env:esp32cam]
platform = espressif32 @ 6.7.0
board = esp32cam
framework = arduino
monitor_speed = 115200
build_flags =
    -I include
    ; Same convention as esp32/platformio.ini (see esp32/OTA.md):
    ; read from environment variables at build time only, NEVER
    ; hardcoded/committed. This module connects to the same home
    ; network as the main ESP32/Raspberry Pi, so it reuses the exact
    ; ROVER_WIFI_SSID/ROVER_WIFI_PASSWORD you already export for that
    ; build -- nothing extra to set up.
    -D ROVER_WIFI_SSID=\"${sysenv.ROVER_WIFI_SSID}\"
    -D ROVER_WIFI_PASSWORD=\"${sysenv.ROVER_WIFI_PASSWORD}\"
    ; AI-Thinker boards need PSRAM enabled explicitly for the camera's
    ; JPEG frame buffers -- without this the board still boots but
    ; init_camera() falls back to the single-DRAM-buffer/QVGA path.
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

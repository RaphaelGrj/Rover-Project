# WireGuard client config template -- for the phone/laptop that will
# reach Rover remotely. See pi/VPN.md. Copy to client.conf (git-ignored,
# NEVER commit the real one) and replace the placeholders. Each remote
# device should get its own keypair and its own copy of this file (with
# a unique Address, eg. 10.66.0.3/24 for a second device).

[Interface]
Address = 10.66.0.2/24
PrivateKey = REMPLACER_PAR_LA_CLE_PRIVEE_DU_CLIENT
DNS = 1.1.1.1

[Peer]
PublicKey = REMPLACER_PAR_LA_CLE_PUBLIQUE_DU_PI
Endpoint = REMPLACER_PAR_IP_OU_DOMAINE_PUBLIC_DE_TA_BOX:51820
# Only the tunnel subnet -- this client only needs to reach the Pi
# itself (rover_control), not be routed through it to the whole home
# LAN or the internet. Smaller blast radius if this device is ever lost
# or its key compromised.
AllowedIPs = 10.66.0.0/24
PersistentKeepalive = 25

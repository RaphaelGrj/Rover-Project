# WireGuard server config template for the Raspberry Pi. See
# pi/VPN.md for the full setup guide. Copy to wg0.conf (git-ignored,
# NEVER commit the real one -- it contains a private key) and replace
# the placeholders with your own generated keys.

[Interface]
Address = 10.66.0.1/24
ListenPort = 51820
PrivateKey = REMPLACER_PAR_LA_CLE_PRIVEE_DU_PI

# One [Peer] block per remote device allowed to connect. Add more
# blocks (each with its own keypair, see pi/VPN.md) for more devices;
# remove a block to revoke that device's access.
[Peer]
# Public key from that device's own client.example.conf-derived keypair.
PublicKey = REMPLACER_PAR_LA_CLE_PUBLIQUE_DU_CLIENT
AllowedIPs = 10.66.0.2/32

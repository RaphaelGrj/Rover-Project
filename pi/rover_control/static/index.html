<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover + no zoom: this is meant to be opened full-screen
     on a phone, pinch-zoom or accidental scroll would fight the joystick -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rover Control</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%; background: #0b0f14; color: #e6edf3;
    font-family: system-ui, -apple-system, sans-serif;
    /* Prevent the browser's own touch gestures (scroll/zoom) from
       stealing pointer events meant for the joystick. */
    touch-action: none; overscroll-behavior: none; user-select: none;
  }
  #status {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 0.6em 1em; font-size: 0.9em; text-align: center;
    background: #161b22; border-bottom: 1px solid #30363d;
  }
  #status.connected { color: #3fb950; }
  #status.disconnected { color: #f85149; }
  #behavior-state {
    display: inline-block; margin-left: 0.6em; padding: 0.1em 0.6em;
    border-radius: 1em; font-size: 0.85em; background: #21262d; color: #7d8590;
  }
  #behavior-state.state-moving { background: #1f6feb33; color: #58a6ff; }
  #behavior-state.state-interacting { background: #3fb95033; color: #3fb950; }
  #behavior-state.state-error { background: #f8514933; color: #f85149; }
  #telemetry .obstacle { color: #f85149; font-weight: 600; }
  #telemetry {
    position: fixed; top: 2.6em; left: 0; right: 0;
    display: flex; flex-direction: column; align-items: center; gap: 0.2em;
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.78em; color: #7d8590; pointer-events: none;
  }
  #telemetry .event { color: #d29922; }
  #telemetry .error { color: #f85149; }
  #telemetry div:empty { display: none; }
  #stage {
    display: flex; align-items: center; justify-content: center;
    gap: 1.2em;
    height: 100%;
  }
  /* Joystick base: fixed circle the stick moves inside of. */
  #joystick-base {
    position: relative;
    width: min(58vw, 58vh); height: min(58vw, 58vh);
    border-radius: 50%;
    background: #161b22;
    border: 2px solid #30363d;
  }
  /* Speed bar: the joystick's companion, not an afterthought -- it is
     what decides how fast Rover goes now that the stick only decides
     where. Sits right next to the pad so one thumb can reach both. */
  #speed-column {
    display: flex; flex-direction: column; align-items: center; gap: 0.5em;
  }
  #speed-bar {
    /* Vertical range input: writing-mode is the standard way (Chrome
       121+, Safari 17.4+), -webkit-appearance the older WebKit/Blink
       one. Both are declared because this page is opened from whatever
       browser the phone in hand happens to run. */
    writing-mode: vertical-lr; direction: rtl;
    -webkit-appearance: slider-vertical;
    width: 2.4em; height: min(50vw, 50vh);
    accent-color: #58a6ff;
    touch-action: none;
  }
  #speed-value {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: 0.85em; color: #e6edf3; text-align: center;
  }
  #speed-label { font-size: 0.7em; color: #7d8590; }
  /* Re-arm button: an ESP32 in SAFE ignores every MOVE until an
     explicit SYSTEM action=resume (main.cpp), and until this button
     existed the only way to send one was to close and reopen the page
     (RoverCore.client_connected). */
  #arm {
    padding: 0.6em 0.9em; font-size: 0.85em;
    background: #238636; color: #fff; border: 0; border-radius: 6px;
  }
  #arm.needed { background: #f85149; animation: arm-pulse 1s ease-in-out infinite; }
  @keyframes arm-pulse { 50% { opacity: 0.55; } }
  #esp-state {
    display: inline-block; margin-left: 0.6em; padding: 0.1em 0.6em;
    border-radius: 1em; font-size: 0.85em; background: #21262d; color: #7d8590;
  }
  #esp-state.esp-SAFE, #esp-state.esp-ERROR { background: #f8514933; color: #f85149; }
  #esp-state.esp-ACTIVE { background: #3fb95033; color: #3fb950; }
  #joystick-stick {
    position: absolute; left: 50%; top: 50%;
    width: 34%; height: 34%;
    border-radius: 50%;
    background: #58a6ff;
    transform: translate(-50%, -50%);
    /* Only animate the snap-back on release, not live dragging -- a
       transition during drag would make the stick visibly lag behind
       the finger. */
    transition: none;
  }
  #joystick-stick.releasing { transition: transform 120ms ease-out; }
  #hint {
    position: fixed; bottom: 0.8em; left: 0; right: 0;
    text-align: center; font-size: 0.8em; color: #7d8590;
  }
  /* Single flex row for the top-right links -- avoids hand-guessing a
     fixed "right: Nem" offset per link (fragile, drifts out of sync
     the moment a label's width changes or a link is added/removed). */
  #top-links {
    position: fixed; top: 0.6em; right: 0.6em; z-index: 1;
    display: flex; gap: 0.4em;
  }
  #top-links a {
    font-size: 0.75em; color: #7d8590; text-decoration: none;
    background: #161b22; border: 1px solid #30363d; border-radius: 4px;
    padding: 0.25em 0.5em;
  }
  /* Video: a small corner panel, not a full-screen takeover -- the
     joystick underneath is still the primary control surface. */
  #video-panel {
    position: fixed; top: 3.4em; right: 0.6em;
    width: min(36vw, 220px); aspect-ratio: 4 / 3;
    background: #161b22; border: 1px solid #30363d; border-radius: 6px;
    overflow: hidden; display: flex; align-items: center; justify-content: center;
  }
  #video-feed { width: 100%; height: 100%; object-fit: cover; }
  #video-feed[hidden] { display: none; }
  #video-unavailable { font-size: 0.75em; color: #7d8590; text-align: center; padding: 0.5em; }
  /* Head-look pad: smaller than the drive joystick and in the opposite
     corner -- a secondary control, not the primary one. */
  #head-pad-base {
    position: fixed; bottom: 3.2em; left: 0.6em;
    width: min(32vw, 140px); height: min(32vw, 140px);
    border-radius: 50%;
    background: #161b22;
    border: 2px solid #30363d;
  }
  #head-pad-stick {
    position: absolute; left: 50%; top: 50%;
    width: 34%; height: 34%;
    border-radius: 50%;
    background: #d29922;
    transform: translate(-50%, -50%);
    transition: none;
  }
  #head-pad-stick.releasing { transition: transform 120ms ease-out; }
</style>
</head>
<body>
<div id="status" class="disconnected"><span id="status-text">Connexion...</span><span id="behavior-state"></span><span id="esp-state"></span></div>
<div id="top-links">
  <a id="ar-link" href="/ar">RA</a>
  <a id="audio-link" href="/audio">Voix</a>
  <a id="ai-link" href="/ai">IA</a>
</div>
<div id="telemetry">
  <div id="obstacle-line" class="obstacle"></div>
  <div id="state-line"></div>
  <div id="event-line" class="event"></div>
  <div id="error-line" class="error"></div>
</div>
<div id="video-panel">
  <img id="video-feed" alt="Flux video Rover">
  <div id="video-unavailable">Camera indisponible</div>
</div>
<div id="stage">
  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>
  <div id="speed-column">
    <div id="speed-value">40%</div>
    <input id="speed-bar" type="range" min="0" max="100" step="5" value="40" orient="vertical"
           aria-label="Vitesse">
    <div id="speed-label">vitesse</div>
    <button id="arm" type="button">Activer</button>
  </div>
</div>
<div id="head-pad-base">
  <div id="head-pad-stick"></div>
</div>
<div id="hint">Barre = vitesse, joystick = direction. Pad orange = regard. Manette prioritaire si branchée.</div>

<script>
"use strict";

// Must stay <= the ESP32's own clamps (motion_config.h:
// ROVER_MAX_WHEEL_SPEED_MPS / ROVER_MAX_ROTATION_RAD_S) -- these are
// just the UI's own ceiling, the firmware clamps again regardless.
// Reached at 100% on the speed bar, not by pushing the stick further:
// since 2026-09-21 the stick carries DIRECTION only (see readAxes()).
const MAX_VELOCITY_MPS = 0.3;
const MAX_ROTATION_RAD_S = 1.5;
// Below this fraction of the pad/stick radius the input counts as
// centred. A direction-only stick has no small commands to ease into,
// so without a deadzone the slightest touch is a full-throttle start.
const DIRECTION_DEADZONE = 0.25;
// Mirrors ROVER_HEAD_PITCH_MIN/MAX_DEG and ROVER_HEAD_YAW_MIN/MAX_DEG
// (esp32/include/head_config.h) -- the ESP32 clamps again regardless,
// this just keeps the pad's range meaningful rather than mostly dead.
const MAX_HEAD_PITCH_DEG = 30;
const MAX_HEAD_YAW_DEG = 90;
const SEND_PERIOD_MS = 100;
const GAMEPAD_DEADZONE = 0.08;

const statusEl = document.getElementById("status");
const statusTextEl = document.getElementById("status-text");
const baseEl = document.getElementById("joystick-base");
const stickEl = document.getElementById("joystick-stick");
const headBaseEl = document.getElementById("head-pad-base");
const headStickEl = document.getElementById("head-pad-stick");
const behaviorStateEl = document.getElementById("behavior-state");
const obstacleLineEl = document.getElementById("obstacle-line");
const stateLineEl = document.getElementById("state-line");
const eventLineEl = document.getElementById("event-line");
const errorLineEl = document.getElementById("error-line");
const videoFeedEl = document.getElementById("video-feed");
const videoUnavailableEl = document.getElementById("video-unavailable");
const speedBarEl = document.getElementById("speed-bar");
const speedValueEl = document.getElementById("speed-value");
const armButtonEl = document.getElementById("arm");
const espStateEl = document.getElementById("esp-state");

// This page was itself only reachable because the URL carried a valid
// ?token= (rover_control/server.py's auth_middleware, checked on every
// route) -- the same token has to be forwarded on the WebSocket and
// video requests below, since each is its own HTTP request the
// middleware checks independently.
const ACCESS_TOKEN = new URLSearchParams(location.search).get("token") || "";
document.getElementById("ai-link").href = "/ai?token=" + encodeURIComponent(ACCESS_TOKEN);
document.getElementById("ar-link").href = "/ar?token=" + encodeURIComponent(ACCESS_TOKEN);
document.getElementById("audio-link").href = "/audio?token=" + encodeURIComponent(ACCESS_TOKEN);

videoFeedEl.hidden = true;
videoFeedEl.addEventListener("load", () => { videoFeedEl.hidden = false; videoUnavailableEl.hidden = true; });
videoFeedEl.addEventListener("error", () => { videoFeedEl.hidden = true; videoUnavailableEl.hidden = false; });
videoFeedEl.src = "/video?token=" + encodeURIComponent(ACCESS_TOKEN);

// Mirrors ROVER_OBSTACLE_THRESHOLD_MM (esp32/include/sensors_config.h) --
// distance_left/right below this is exactly what makes the ESP32 itself
// fire EVENT name=obstacle_detected, so the UI warning lines up with it.
const OBSTACLE_THRESHOLD_MM = 150;

// French label for each RoverBehaviorState (pi/rover_core/core.py) --
// kept as a lookup rather than showing the raw enum name so this stays
// readable even once EXPLORING/PATROLLING/etc. start appearing.
const BEHAVIOR_STATE_LABELS = {
  IDLE: "inactif", INTERACTING: "en attente", MOVING: "en mouvement",
  EXPLORING: "exploration", PATROLLING: "patrouille", FOLLOWING: "suivi",
  CHARGING: "charge", SLEEPING: "sommeil", ERROR: "erreur",
};

// --- WebSocket, with auto-reconnect -----------------------------------

let ws = null;
let eventClearTimer = null;
let errorClearTimer = null;

function formatFields(data) {
  return Object.entries(data)
    .filter(([key]) => key !== "type")
    .map(([key, value]) => `${key}=${value}`)
    .join(" ");
}

// STATE fields accumulate here across messages -- the ESP32 sends
// distance/IMU/environment/wheel-speed/diag as separate STATE lines
// (ROVER_PROTOCOL.md §7.1), so merging (not replacing) is what lets the
// display show all of them at once instead of flickering between
// whichever single line arrived most recently. Mirrors the same merge
// RoverCore does server-side for a late-joining client's replay.
let mergedState = {};

function updateObstacleLine() {
  const left = Number(mergedState.distance_left);
  const right = Number(mergedState.distance_right);
  const closeLeft = Number.isFinite(left) && left < OBSTACLE_THRESHOLD_MM;
  const closeRight = Number.isFinite(right) && right < OBSTACLE_THRESHOLD_MM;
  if (!closeLeft && !closeRight) {
    obstacleLineEl.textContent = "";
    return;
  }
  const sides = [closeLeft && "gauche", closeRight && "droite"].filter(Boolean).join(" + ");
  obstacleLineEl.textContent = `⚠ obstacle proche (${sides})`;
}

// STATE is a standing status (always shows the latest merged fields);
// EVENT/ERROR are transient occurrences (ROVER_PROTOCOL.md §8: distinct
// message categories, not one generic "status") so each gets its own
// line and clears itself after a few seconds instead of lingering
// forever. ROVER_STATE is a synthetic type (not part of Rover Protocol
// itself -- see RoverCore._set_state) carrying the Pi's own high-level
// behavior state.
// The ESP32's own hardware state machine (BOOT/READY/ACTIVE/SAFE/ERROR,
// board_config.h) -- NOT the Pi's behavior state next to it, the two are
// deliberately separate (ARCHITECTURE_AND_ROADMAP.md §20). Worth showing
// because a robot in SAFE silently ignores every MOVE: without this, a
// heartbeat timeout after a WiFi hiccup looks exactly like a dead motor.
function updateEspStateChip() {
  const espState = mergedState.state;
  espStateEl.textContent = espState ? "ESP32: " + espState : "";
  espStateEl.className = espState ? "esp-" + espState : "";
  // Only SAFE is something the operator can clear from here. ERROR is
  // not resumable (main.cpp), and a held E-stop makes the firmware
  // refuse the resume outright -- promising otherwise would be a lie.
  const needsArming = espState === "SAFE" && mergedState.estop !== "1";
  armButtonEl.classList.toggle("needed", needsArming);
}

function handleEsp32Message(data) {
  if (data.type === "STATE") {
    mergedState = { ...mergedState, ...data };
    delete mergedState.type;
    stateLineEl.textContent = "etat: " + formatFields(mergedState);
    updateObstacleLine();
    updateEspStateChip();
  } else if (data.type === "EVENT") {
    eventLineEl.textContent = "evenement: " + formatFields(data);
    clearTimeout(eventClearTimer);
    eventClearTimer = setTimeout(() => { eventLineEl.textContent = ""; }, 5000);
  } else if (data.type === "ERROR") {
    errorLineEl.textContent = "erreur: " + formatFields(data);
    clearTimeout(errorClearTimer);
    errorClearTimer = setTimeout(() => { errorLineEl.textContent = ""; }, 5000);
  } else if (data.type === "ROVER_STATE") {
    behaviorStateEl.textContent = BEHAVIOR_STATE_LABELS[data.state] || data.state;
    behaviorStateEl.className = "state-" + String(data.state).toLowerCase();
  }
}

function connect() {
  const url = (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
    "/ws?token=" + encodeURIComponent(ACCESS_TOKEN);
  ws = new WebSocket(url);
  ws.onopen = () => { statusTextEl.textContent = "Connecte"; statusEl.className = "connected"; };
  ws.onclose = () => {
    statusTextEl.textContent = "Deconnecte -- nouvelle tentative...";
    statusEl.className = "disconnected";
    // Stale sensor/behavior readouts from before the drop would
    // otherwise linger on screen looking current; the replay-on-connect
    // (server.py) refreshes all of this again once reconnected.
    behaviorStateEl.textContent = "";
    behaviorStateEl.className = "";
    mergedState = {};
    stateLineEl.textContent = "";
    obstacleLineEl.textContent = "";
    updateEspStateChip();
    setTimeout(connect, 1000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (evt) => {
    let data;
    try { data = JSON.parse(evt.data); } catch { return; }
    if (data && typeof data.type === "string") handleEsp32Message(data);
  };
}
connect();

function sendCommand(velocity, rotation, headPitch, headYaw) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ velocity, rotation, head_pitch: headPitch, head_yaw: headYaw }));
}

// SYSTEM action=resume, via the Pi (rover_control/server.py ->
// RoverCore.resume). The Pi already sends one when a control client
// connects, but that is a one-shot: anything that drops the ESP32 into
// SAFE *afterwards* -- a heartbeat timeout from a WiFi hiccup, a
// released E-stop -- used to leave the page connected, the joystick
// alive and the robot deaf until someone reloaded the tab.
armButtonEl.addEventListener("click", () => {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  ws.send(JSON.stringify({ action: "resume" }));
});

// --- Speed bar: how fast, decided here and only here ------------------
// The joystick used to set both direction and magnitude, so speed
// changed with every drift of the thumb and each drift was another
// distinct MOVE for the ESP32 to chew on. Splitting them gives a speed
// that holds still while driving -- which is also what makes the
// duplicate-MOVE suppression in RoverCore.move() actually bite.
speedBarEl.addEventListener("input", () => {
  speedValueEl.textContent = speedBarEl.value + "%";
});
function throttle() {
  return Number(speedBarEl.value) / 100;
}

// --- Touch/mouse joystick (Pointer Events: one API for both) ----------

let touchAxes = { x: 0, y: 0 }; // both in [-1, 1], y: -1 = up/forward
let dragging = false;
let activePointerId = null;

function updateStickVisual(x, y, releasing) {
  stickEl.classList.toggle("releasing", releasing);
  const radiusPx = baseEl.clientWidth / 2 - stickEl.clientWidth / 2;
  stickEl.style.transform =
    `translate(calc(-50% + ${x * radiusPx}px), calc(-50% + ${y * radiusPx}px))`;
}

function setTouchAxesFromEvent(evt) {
  const rect = baseEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const radius = rect.width / 2;
  let x = (evt.clientX - cx) / radius;
  let y = (evt.clientY - cy) / radius;
  const mag = Math.hypot(x, y);
  if (mag > 1) { x /= mag; y /= mag; } // clamp to the base circle
  touchAxes = { x, y };
  updateStickVisual(x, y, false);
}

baseEl.addEventListener("pointerdown", (evt) => {
  dragging = true;
  activePointerId = evt.pointerId;
  baseEl.setPointerCapture(evt.pointerId);
  setTouchAxesFromEvent(evt);
});
baseEl.addEventListener("pointermove", (evt) => {
  if (dragging && evt.pointerId === activePointerId) setTouchAxesFromEvent(evt);
});
function releaseStick(evt) {
  if (evt.pointerId !== activePointerId) return;
  dragging = false;
  activePointerId = null;
  touchAxes = { x: 0, y: 0 };
  updateStickVisual(0, 0, true);
}
baseEl.addEventListener("pointerup", releaseStick);
baseEl.addEventListener("pointercancel", releaseStick);

// --- Touch/mouse head-look pad -- same pattern as the drive joystick
// above, but its own pointer id so both can be dragged at once (eg. two
// thumbs on a phone) instead of one stealing the other's pointer capture. ---

let headTouchAxes = { x: 0, y: 0 };
let headDragging = false;
let activeHeadPointerId = null;

function updateHeadStickVisual(x, y, releasing) {
  headStickEl.classList.toggle("releasing", releasing);
  const radiusPx = headBaseEl.clientWidth / 2 - headStickEl.clientWidth / 2;
  headStickEl.style.transform =
    `translate(calc(-50% + ${x * radiusPx}px), calc(-50% + ${y * radiusPx}px))`;
}

function setHeadTouchAxesFromEvent(evt) {
  const rect = headBaseEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const radius = rect.width / 2;
  let x = (evt.clientX - cx) / radius;
  let y = (evt.clientY - cy) / radius;
  const mag = Math.hypot(x, y);
  if (mag > 1) { x /= mag; y /= mag; }
  headTouchAxes = { x, y };
  updateHeadStickVisual(x, y, false);
}

headBaseEl.addEventListener("pointerdown", (evt) => {
  headDragging = true;
  activeHeadPointerId = evt.pointerId;
  headBaseEl.setPointerCapture(evt.pointerId);
  setHeadTouchAxesFromEvent(evt);
});
headBaseEl.addEventListener("pointermove", (evt) => {
  if (headDragging && evt.pointerId === activeHeadPointerId) setHeadTouchAxesFromEvent(evt);
});
function releaseHeadStick(evt) {
  if (evt.pointerId !== activeHeadPointerId) return;
  headDragging = false;
  activeHeadPointerId = null;
  headTouchAxes = { x: 0, y: 0 };  // spring back to looking straight ahead
  updateHeadStickVisual(0, 0, true);
}
headBaseEl.addEventListener("pointerup", releaseHeadStick);
headBaseEl.addEventListener("pointercancel", releaseHeadStick);

// --- Gamepad API (physical controller), preferred over touch when present ---
// Standard mapping: axes 0/1 = left stick (drive), 2/3 = right stick
// (head look) -- the common left-drive/right-look convention.

function readGamepadAxes() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const pad of pads) {
    if (!pad) continue;
    let x = pad.axes[0] || 0;
    let y = pad.axes[1] || 0;
    if (Math.abs(x) < GAMEPAD_DEADZONE) x = 0;
    if (Math.abs(y) < GAMEPAD_DEADZONE) y = 0;
    let headX = pad.axes[2] || 0;
    let headY = pad.axes[3] || 0;
    if (Math.abs(headX) < GAMEPAD_DEADZONE) headX = 0;
    if (Math.abs(headY) < GAMEPAD_DEADZONE) headY = 0;
    return { x, y, headX, headY };
  }
  return null;
}

// --- Direction only: the stick says WHERE, the bar says HOW FAST ------
// Normalising to unit length is the whole change: half-way out and all
// the way out now drive at the same speed, the one on the bar. Below the
// deadzone it is a clean stop rather than a crawl. Applies to the gamepad
// too, so both input paths obey the same bar instead of disagreeing about
// what a half-pushed stick means.
function directionFromAxes(axes) {
  const magnitude = Math.hypot(axes.x, axes.y);
  if (magnitude < DIRECTION_DEADZONE) return { x: 0, y: 0 };
  return { x: axes.x / magnitude, y: axes.y / magnitude };
}

// --- Fixed-rate send loop: always send the latest axes, even if
// unchanged, so a stuck/idle client is an explicit "0,0" rather than
// silence. Kept at SEND_PERIOD_MS on purpose even though most of those
// messages now repeat themselves: this cadence is what proves the
// *browser* is still alive, and it is RoverCore.move() that drops the
// duplicates before they reach the ESP32 (one place, on the link that
// actually needed relief). Cutting it here instead would have let a
// frozen page keep the robot rolling on its last command. ---

setInterval(() => {
  const gamepad = readGamepadAxes();
  const direction = directionFromAxes(gamepad || touchAxes);
  const speed = throttle();
  const velocity = -direction.y * speed * MAX_VELOCITY_MPS; // stick up = forward
  const rotation = direction.x * speed * MAX_ROTATION_RAD_S;

  // The head pad keeps its proportional behaviour: it aims at an angle,
  // it is not a speed, so "how far you push it" IS the command.
  const headAxesX = gamepad ? gamepad.headX : headTouchAxes.x;
  const headAxesY = gamepad ? gamepad.headY : headTouchAxes.y;
  const headPitch = -headAxesY * MAX_HEAD_PITCH_DEG; // stick/pad up = look up
  const headYaw = headAxesX * MAX_HEAD_YAW_DEG;

  sendCommand(velocity, rotation, headPitch, headYaw);
}, SEND_PERIOD_MS);
</script>
</body>
</html>
